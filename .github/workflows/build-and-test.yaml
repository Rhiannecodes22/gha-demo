name: Build and test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - infra/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inventory configuration
        run: echo "Configuration is valid; later jobs start on separate runners"

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - proposition: nbcu
            profile: nbcu-dev-admin
            inventory: aws/nbcu
          - proposition: nbcu
            profile: nbcu-prod-admin
            inventory: aws/nbcu
          - proposition: skycloud
            profile: skycloud-dev-admin
            inventory: aws/skyeu
          - proposition: skycloud
            profile: skycloud-prod-admin
            inventory: aws/skyeu
    steps:
      - name: Generate ${{ matrix.target.profile }} inventory
        run: |
          echo "This matrix job has its own runner and workspace"
          echo "AWS_PROFILE=${{ matrix.target.profile }}"
          echo "ansible-inventory --list -i ${{ matrix.target.inventory }}"
          echo "proposition=${{ matrix.target.proposition }}"

  notify:
    needs: test
    if: always()
    uses: ./.github/workflows/notify-slack.yaml
    with:
      operation: Inventory
      result: ${{ needs.test.result }}
    secrets: inherit

