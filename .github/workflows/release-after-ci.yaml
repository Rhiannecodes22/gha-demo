name: Release after CI

on:
  workflow_run:
    workflows: [Build and test]
    types: [completed]

permissions:
  contents: read

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Release
        run: echo "Release after successful Build and test"
