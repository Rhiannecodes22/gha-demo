name: AWS Keyspaces - IRSA Role - Dev
description: Request dev IRSA IAM roles for a Kubernetes service account to access AWS Keyspaces.
title: "Provision IAM Roles for IRSA Authentication - Dev - "
labels:
  - AWS
  - Persistence - AWS Keyspaces
body:
  - type: markdown
    attributes:
      value: |
        One dev request is one application and one service account. It does not create an IAM user or the keyspace.

        Each proposition is one role. Leave a proposition empty when this request has no role there. Dev has one region for each proposition: SkyEU is eu-central-1, NBCU is us-west-2, and Summer is us-east-2.

        Enter one name per line. The description above each box stays visible while you type.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - Urgent (today or this week)
        - Normal (next or upcoming Sprint)
        - Low (after next Sprint or later)
    validations:
      required: true

  - type: input
    id: completion_date
    attributes:
      label: Required completion date
      description: Add a date if there is one. Otherwise leave this blank.

  - type: dropdown
    id: team
    attributes:
      label: Team
      description: Team that owns the application. This is the team tag on the IAM role. Choose Other if your team is not listed.
      options:
        - alto
        - arcus
        - kraken
        - kronos
        - lakitu
        - loki
        - nova
        - phoenix
        - pulse
        - yoshi
        - Other
    validations:
      required: true

  - type: input
    id: team_name
    attributes:
      label: Team name
      description: Fill this in only when Team is Other. Use lowercase letters, digits, or hyphens.

  - type: dropdown
    id: app_name
    attributes:
      label: App name
      description: The code is the Keyspaces register name. Choose Other if your application is not listed.
      options:
        - ai
        - apex_adapter
        - aps
        - avo
        - bm
        - bms
        - boo
        - cdn_manager
        - cmp
        - csag
        - dds
        - devices
        - dm
        - drm_kg
        - els (Enforced Localisation Service)
        - em
        - geobridge
        - hkm
        - ls (Localisation Service)
        - mali
        - meo
        - mvpdb
        - ovp_reference (Reference app)
        - pc (Parental Control)
        - pvs
        - ras
        - rilo
        - rm
        - rms
        - roman
        - rs (Returning Series, RSS and RSI)
        - rv
        - scupper
        - sse
        - ssei
        - tm
        - tmi
        - umv
        - Other
    validations:
      required: true

  - type: input
    id: application_name
    attributes:
      label: Application name
      description: Fill this in only when App name is Other. Use the register slug, with lowercase letters, digits, and underscores.

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: This form is for dev.
      options:
        - dev
    validations:
      required: true

  - type: input
    id: service_account
    attributes:
      label: Service account
      description: The service account name on its own, for example ls-sa. One name for every proposition in this request.
      placeholder: ls-sa
    validations:
      required: true

  - type: input
    id: point_of_contact
    attributes:
      label: Point of contact
      description: Who SRE should reply to.
    validations:
      required: true

  - type: textarea
    id: skyeu_namespaces
    attributes:
      label: SkyEU namespaces
      description: One namespace per line. Leave empty when this request has no SkyEU role. Example, ls-stable-int.
    validations:
      required: false

  - type: textarea
    id: skyeu_keyspaces
    attributes:
      label: SkyEU keyspaces
      description: One keyspace per line. Every name here is eu-central-1. Example, ls_stable_int_skyeu.
    validations:
      required: false

  - type: textarea
    id: nbcu_namespaces
    attributes:
      label: NBCU namespaces
      description: One namespace per line. Leave empty when this request has no NBCU role. Example, ls-stable-int.
    validations:
      required: false

  - type: textarea
    id: nbcu_keyspaces
    attributes:
      label: NBCU keyspaces
      description: One keyspace per line. Every name here is us-west-2. Example, ls_stable_int_nbcu.
    validations:
      required: false

  - type: textarea
    id: summer_namespaces
    attributes:
      label: Summer namespaces
      description: One namespace per line. Leave empty when this request has no Summer role. Example, ls-summer-stubbed-nft.
    validations:
      required: false

  - type: textarea
    id: summer_keyspaces
    attributes:
      label: Summer keyspaces
      description: One keyspace per line. Every name here is us-east-2. Example, ls_sst_stubbed_nft_summer.
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything that does not fit the boxes. A second service account written here is not added to the role.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Useful docs: [High Level How OVP SRE Manages AWS Keyspaces](https://gspcloud.atlassian.net/wiki/spaces/ODO/pages/1862205461/High+Level+How+OVP+SRE+Manages+AWS+Keyspaces)

        Definition of Done, for OVP SRE after the request is submitted:

        - [ ] IAM roles created for each proposition in this request
        - [ ] Trust relationship limited to the service account in the namespaces listed
        - [ ] Role ARNs provided to team
