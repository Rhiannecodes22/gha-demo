name: AWS Keyspaces - IRSA Role
description: Request an IAM role so a Kubernetes ServiceAccount can access AWS Keyspaces.
title: "[AWS Keyspaces IRSA] Provision "
labels:
  - AWS
  - Persistence - AWS Keyspaces

body:
  - type: markdown
    attributes:
      value: |
        One issue is one environment and one role. Fill every organisation this role needs. Leave an organisation blank when it is not part of this request.

        The ServiceAccount name is the name in your ServiceAccount manifest, on its own. It does not have to exist before this role is created. After the role exists, your team adds that ServiceAccount, sets the `eks.amazonaws.com/role-arn` annotation, and removes the IAM user secret.

        SRE assigns the role name and the permissions. Connection endpoints are already configured.

  - type: dropdown
    id: team
    attributes:
      label: Team
      description: Team that owns the application. Choose Other if your team is not listed, and enter the name below.
      options:
        - kronos
        - kraken
        - phoenix
        - yoshi
        - Other
    validations:
      required: true

  - type: input
    id: team_other
    attributes:
      label: Team name
      description: Fill this in only when Team is Other.
      placeholder: loki

  - type: dropdown
    id: application
    attributes:
      label: Application
      description: Applications that already have an AWS Keyspace. Choose Other if yours is not listed. Returning Series covering both RSS and RSI is rs.
      options:
        - ai
        - apex_adapter
        - aps
        - avo
        - bm
        - bms
        - boo
        - cdn_manager
        - cmp
        - csag
        - dds
        - devices
        - dm
        - drm_kg
        - els
        - em
        - ls
        - hkm
        - geobridge
        - mali
        - meo
        - mvpdb
        - ovp_reference
        - pc
        - pvs
        - ras
        - rilo
        - rm
        - rms
        - roman
        - rs
        - rsi
        - rss
        - rv
        - scupper
        - sse
        - ssei
        - tm
        - tmi
        - umv
        - Other
    validations:
      required: true

  - type: input
    id: application_other
    attributes:
      label: Application name
      description: Fill this in only when Application is Other. Short name, lowercase, with underscores.
      placeholder: my_app

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Raise a separate issue for each environment. Stage applies to NBCU.
      options:
        - dev
        - stage
        - prod
    validations:
      required: true

  - type: input
    id: service_account
    attributes:
      label: ServiceAccount name
      description: e.g app_name-sa.
      placeholder: app_name-sa
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### Sky
        Single region, eu-central-1. Leave both boxes blank if this request has no Sky role.

  - type: textarea
    id: sky_namespaces
    attributes:
      label: Sky namespaces
      description: One namespace per line. Each namespace is trusted to use the ServiceAccount name above.
      placeholder: |
        ls-int
        ls-stable-int
      render: text

  - type: textarea
    id: sky_keyspaces
    attributes:
      label: Sky keyspaces
      description: One keyspace name per line.
      placeholder: |
        ls_int_skyeu
        ls_stable_int_skyeu
      render: text

  - type: markdown
    attributes:
      value: |
        ### NBCU
        Dev Single region (us-west-2). Dual region (us-west-2 and us-east-2). Choose single region unless every keyspace below is deployed in both regions.

  - type: dropdown
    id: nbcu_replication
    attributes:
      label: NBCU replication
      options:
        - Not requested
        - Single region
        - Dual region
    validations:
      required: true

  - type: textarea
    id: nbcu_namespaces
    attributes:
      label: NBCU namespaces
      description: One namespace per line. Leave blank when NBCU is not requested.
      placeholder: |
        ls-stable-int
        ls-stubbed-nft
      render: text

  - type: textarea
    id: nbcu_keyspaces
    attributes:
      label: NBCU keyspaces
      description: One keyspace name per line. Leave blank when NBCU is not requested.
      placeholder: |
        ls_stable_int_nbcu
        ls_stubbed_nft_nbcu
      render: text

  - type: markdown
    attributes:
      value: |
        ### Summer
        Single region. Dev is us-east-2. Prod is eu-central-1. Leave both boxes blank if this request has no Summer role.

  - type: textarea
    id: summer_namespaces
    attributes:
      label: Summer namespaces
      description: One namespace per line.
      placeholder: |
        ls-summer-stubbed-nft
      render: text

  - type: textarea
    id: summer_keyspaces
    attributes:
      label: Summer keyspaces
      description: One keyspace name per line.
      placeholder: |
        ls_stubbed_nft_summer
      render: text

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything that does not fit the boxes above. For example a second ServiceAccount and its namespaces, a keyspace that is single region when the NBCU choice is dual region, or the role name you expect.
      render: text