- type: input
  id: service_account
  attributes:
    label: ServiceAccount name
    description: One name for every namespace in this request. The name only. GeoBridge uses geobridge-sa.
    placeholder: geobridge-sa
  validations:
    required: true

- type: markdown
  attributes:
    value: |
      ### Sky
      Leave blank if this request has no Sky role. Dev and prod are eu-central-1.

- type: textarea
  id: sky_namespaces
  attributes:
    label: Sky namespaces
    description: One namespace per line. These are trusted to use the ServiceAccount name above.
    placeholder: |
      geobridge-int
      geobridge-stable-int
  validations:
    required: false

- type: textarea
  id: sky_keyspaces
  attributes:
    label: Sky keyspaces
    description: One keyspace name per line.
    placeholder: |
      geobridge_int_skyeu
      geobridge_stable_int_skyeu
  validations:
    required: false

- type: markdown
  attributes:
    value: |
      ### NBCU
      Leave a region blank when no keyspace is deployed there.

- type: textarea
  id: nbcu_namespaces
  attributes:
    label: NBCU namespaces
    description: One namespace per line.
    placeholder: |
      geobridge-stable-int
      geobridge-stubbed-nft
  validations:
    required: false

- type: textarea
  id: nbcu_keyspaces_us_west_2
  attributes:
    label: NBCU keyspaces in us-west-2
    description: One keyspace name per line.
    placeholder: |
      geobridge_stable_int_nbcu
  validations:
    required: false

- type: textarea
  id: nbcu_keyspaces_us_east_2
  attributes:
    label: NBCU keyspaces in us-east-2
    description: One keyspace name per line. Repeat a name here when that keyspace is also deployed in us-west-2.
    placeholder: |
      geobridge_prod_nbcu
  validations:
    required: false

- type: markdown
  attributes:
    value: |
      ### Summer
      Leave blank if this request has no Summer role. Dev is us-east-2. The dev role is created in the NBCU dev account.

- type: textarea
  id: summer_namespaces
  attributes:
    label: Summer namespaces
    description: One namespace per line.
    placeholder: |
      geobridge-summer-stubbed-nft
  validations:
    required: false

- type: textarea
  id: summer_keyspaces
  attributes:
    label: Summer keyspaces
    description: One keyspace name per line.
    placeholder: |
      geobridge_stubbed_nft_summer
  validations:
    required: false