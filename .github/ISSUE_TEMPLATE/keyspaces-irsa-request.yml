name: AWS Keyspaces - IRSA Role
description: Request IAM roles so a Kubernetes ServiceAccount can access AWS Keyspaces.
title: "[AWS Keyspaces IRSA] Provision "
labels:
  - AWS
  - Persistence - AWS Keyspaces

body:
  - type: markdown
    attributes:
      value: |
        One issue is one environment. List every Sky, NBCU, and Summer deployment that needs a role in that environment. Dev, stage, and prod are separate issues.

        From your repo, copy:
        - the ServiceAccount `metadata.name` (Avatar Orchestrator uses `avatar-orchestrator`)
        - the namespace the pods run in (for example `avo-stubbed-functional`)
        - `spring.cassandra.keyspace-name`
        - the region folder that file is in, such as `eu-central-1` or `us-west-2`

        Write the ServiceAccount name on its own. Write each namespace on its own line below. Leave the role name, the policy, and the connection endpoints to SRE.

        This creates the roles only. Your team creates the ServiceAccount, sets `eks.amazonaws.com/role-arn`, and removes the IAM user secret.

  - type: input
    id: team
    attributes:
      label: Team
      description: Team that owns the application.
      placeholder: kronos
    validations:
      required: true

  - type: input
    id: application
    attributes:
      label: Application
      description: Short application name, as used in your repo.
      placeholder: avatar-orchestrator
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: Repository
      description: Link to the application repository, so the namespaces and keyspaces can be checked.
      placeholder: https://github.com/NBCUDTC/ovp-avatar-orchestrator
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Dev, stage, or prod. File a separate issue for each.
      options:
        - dev
        - stage
        - prod
    validations:
      required: true

  - type: input
    id: service_account
    attributes:
      label: ServiceAccount name
      description: The name in your ServiceAccount manifest. One name, with no namespace. Avatar Orchestrator uses `avatar-orchestrator`.
      placeholder: avatar-orchestrator
    validations:
      required: true

  - type: textarea
    id: deployments
    attributes:
      label: Deployments
      description: One line per deployment, with the organisation, the namespace, the keyspace name, and the region. Use a second line when a namespace has another keyspace, or when the same keyspace is deployed in a second region.
      placeholder: |
        Sky avo-stubbed-functional avo_stubbed_functional_skyeu eu-central-1
        NBCU avo-stable-int avo_stable_int_nbcu us-west-2
      render: text
    validations:
      required: true

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: We will create this ServiceAccount in each namespace above, set the role annotation, and remove the IAM user secret after the roles exist.
          required: true